<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f3a5f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Porte à porte</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{--blue:#1f3a5f;--accent:#ff6b35;--bg:#fff;--ink:#14202e;--muted:#5b6b7d;--line:#e3e8ee;--danger:#c62828}
@media(prefers-color-scheme:dark){:root{--bg:#121a24;--ink:#e8eef5;--muted:#9aabbd;--line:#2a3646;--danger:#ff6b6b}}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--bg);overflow:hidden}
button{font:inherit;cursor:pointer}
#map{position:fixed;inset:0;z-index:0}

header{position:fixed;top:0;left:0;right:0;z-index:1000;display:flex;align-items:center;gap:10px;
  padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;background:var(--blue);color:#fff;box-shadow:0 2px 10px rgba(0,0,0,.25)}
header h1{font-size:18px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#gps{font-size:13px;white-space:nowrap;display:flex;align-items:center;gap:6px;opacity:.9}
#gps i{width:9px;height:9px;border-radius:50%;background:#9aa7b5}
#gps.ok i{background:#4cd964}#gps.ko i{background:#ff5a5a}
#net{font-size:12px;font-weight:700;padding:3px 8px;border-radius:6px;background:#ff5a5a;color:#fff;white-space:nowrap}
#net[hidden]{display:none}
#listBtn,#streetBtn{min-height:40px;padding:0 12px;border:1px solid rgba(255,255,255,.35);border-radius:10px;background:rgba(255,255,255,.12);color:#fff;font-weight:600;white-space:nowrap}

#ring{position:fixed;z-index:1000;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 26px);
  display:flex;align-items:center;gap:10px;padding:16px 28px;border:0;border-radius:999px;background:var(--accent);color:#fff;
  font-weight:700;font-size:18px;box-shadow:0 6px 20px rgba(255,107,53,.45),0 2px 6px rgba(0,0,0,.25);white-space:nowrap}
#ring:active{transform:translateX(-50%) scale(.96)}
#ring:disabled{opacity:.75}
#ring svg{width:22px;height:22px}

.pin span{display:block;width:28px;height:28px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);
  background:var(--accent);border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.35);position:relative}
.pin span::after{content:"";position:absolute;inset:7px;border-radius:50%;background:#fff}
.pin.todo span{background:#8a97a6}
.pin.moving span{background:#2b7cff}

.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--bg);color:var(--ink)}
.leaflet-popup-content{margin:14px 16px}
.pop .addr{font-weight:700;font-size:16px;line-height:1.3;margin-bottom:4px}
.pop .meta{color:var(--muted);font-size:13px;margin-bottom:10px}
.pop label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
.pop textarea{width:100%;font:16px/1.4 inherit;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);resize:vertical}
.pop .acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.pop .acts button,.sheet .acts button{min-height:40px;padding:0 12px;border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--ink);font-size:14px}
.pop .acts .danger,.sheet .acts .danger{color:var(--danger);border-color:currentColor}
.pop .acts .primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700;width:100%}
.street{display:flex;gap:8px;padding:0 16px}
.street input{flex:1;min-height:44px;padding:0 10px;font:16px inherit;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.street button{min-height:44px;padding:0 14px;border:0;border-radius:8px;background:var(--blue);color:#fff;font-weight:600}
.hint{margin:10px 16px;color:var(--muted);font-size:14px}

#backdrop{position:fixed;inset:0;z-index:1100;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .2s}
#backdrop.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:1200;max-height:75vh;display:flex;flex-direction:column;background:var(--bg);
  border-radius:16px 16px 0 0;box-shadow:0 -6px 24px rgba(0,0,0,.25);transform:translateY(105%);transition:transform .25s ease;
  padding-bottom:env(safe-area-inset-bottom)}
.sheet.open{transform:none}
.sheet .head{display:flex;align-items:center;padding:14px 16px 8px}
.sheet h2{font-size:18px;margin:0;flex:1}
.sheet .close{width:40px;height:40px;border:0;background:transparent;color:var(--ink);font-size:24px;line-height:1}
.sheet ul{list-style:none;margin:0;padding:0 8px;overflow:auto;flex:1}
.sheet li button{display:block;width:100%;text-align:left;padding:12px 10px;border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--ink)}
.sheet li b{display:block;font-size:15px}
.sheet li small{color:var(--muted);font-size:13px}
.sheet li em{display:block;font-style:normal;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sheet .empty{padding:24px 16px;color:var(--muted)}
.sheet .acts{display:flex;flex-wrap:wrap;gap:8px;padding:12px 16px;border-top:1px solid var(--line)}

#toast{position:fixed;z-index:1300;left:50%;bottom:calc(env(safe-area-inset-bottom) + 96px);transform:translateX(-50%) translateY(10px);
  max-width:min(92vw,420px);padding:10px 16px;border-radius:10px;background:#14202e;color:#fff;font-size:14px;text-align:center;
  opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
#toast.show{opacity:1;transform:translateX(-50%)}
@media(prefers-reduced-motion:reduce){.sheet,#toast,#backdrop{transition:none}}
</style>
</head>
<body>
<header>
  <h1>Porte à porte</h1>
  <span id="gps"><i></i><span>GPS…</span></span>
  <span id="net" hidden>Hors ligne</span>
  <button id="streetBtn" type="button">Rue</button>
  <button id="listBtn" type="button">Liste (0)</button>
</header>

<div id="map"></div>

<button id="ring" type="button">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
  <span>Je sonne ici</span>
</button>

<div id="backdrop"></div>
<section class="sheet" id="sheet" aria-label="Liste des portes">
  <div class="head"><h2 id="sheetTitle">Portes visitées</h2><button class="close" data-close type="button" aria-label="Fermer">×</button></div>
  <ul id="list"></ul>
  <div class="acts">
    <button type="button" id="expCsv">Exporter CSV</button>
    <button type="button" id="expJson">Sauvegarde JSON</button>
    <button type="button" id="impJson">Importer JSON</button>
    <button type="button" id="cacheZone">Garder cette zone hors ligne</button>
    <button type="button" id="clearTodo">Retirer les non visitées</button>
    <button type="button" id="clearAll" class="danger">Tout effacer</button>
    <input type="file" id="impFile" accept=".json,application/json" hidden>
  </div>
</section>

<section class="sheet" id="streetSheet" aria-label="Ajouter une rue">
  <div class="head"><h2>Ajouter les adresses d’une rue</h2><button class="close" data-close type="button" aria-label="Fermer">×</button></div>
  <form class="street" id="streetForm">
    <input id="streetQ" type="search" value="Rue Jean-Baptiste Lebas, 59493 Villeneuve-d'Ascq" aria-label="Rue et ville" autocomplete="off">
    <button type="submit">Chercher</button>
  </form>
  <p class="hint" id="streetMsg">Tape la rue et la ville, puis choisis la bonne rue dans la liste.</p>
  <ul id="streetList"></ul>
</section>

<div id="toast" role="status"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
{
  const KEY = 'pap-points-v1';
  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const fmt = iso => new Date(iso).toLocaleString('fr-FR', {day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit'});

  let points = [];
  try { points = JSON.parse(localStorage.getItem(KEY)) || []; } catch (e) { points = []; }
  points.forEach(p => { if (!p.etat) p.etat = 'sonne'; });   // 'prevu' = à visiter, 'sonne' = visité
  const norm = s => String(s ?? '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();
  const touch = pt => { pt.maj = new Date().toISOString(); };   // date de dernière modification, pour la future synchro
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(points)); } catch (e) { toast('Sauvegarde impossible sur cet appareil'); } };

  let toastTimer;
  function toast(msg, ms = 3000) {
    const t = $('toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), ms);
  }

  // ---------- Carte ----------
  const map = L.map('map', {zoomControl: false}).setView([46.6, 2.4], 6);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19, attribution: '© OpenStreetMap', crossOrigin: true
  }).addTo(map);

  // ---------- Position en direct ----------
  let me = null, meAcc = null, lastPos = null, centered = false;
  function setGps(acc, err) {
    const g = $('gps');
    g.className = acc != null ? 'ok' : (err ? 'ko' : '');
    g.lastChild.textContent = acc != null ? `GPS ±${Math.round(acc)} m` : (err ? 'GPS indisponible' : 'GPS…');
  }
  function geoError(e) {
    if (!e) return 'Localisation impossible';
    if (e.code === 1) return 'Autorise la localisation pour ce site dans ton navigateur';
    if (e.code === 2) return 'Position introuvable, essaie à découvert';
    if (e.code === 3) return 'Le GPS met trop de temps, réessaie';
    return 'Localisation impossible';
  }
  if (!window.isSecureContext) toast('La localisation exige une adresse en https', 6000);
  if ('geolocation' in navigator) {
    navigator.geolocation.watchPosition(p => {
      lastPos = p;
      const ll = [p.coords.latitude, p.coords.longitude];
      if (!me) {
        meAcc = L.circle(ll, {radius: p.coords.accuracy, stroke: false, fillColor: '#2b7cff', fillOpacity: .12, interactive: false}).addTo(map);
        me = L.circleMarker(ll, {radius: 8, color: '#fff', weight: 3, fillColor: '#2b7cff', fillOpacity: 1, interactive: false}).addTo(map);
      } else { me.setLatLng(ll); meAcc.setLatLng(ll).setRadius(p.coords.accuracy); }
      if (!centered) { map.setView(ll, 18); centered = true; }
      setGps(p.coords.accuracy);
    }, e => setGps(null, e), {enableHighAccuracy: true, maximumAge: 3000, timeout: 20000});
  } else setGps(null, true);

  // ---------- Adresse à partir des coordonnées ----------
  async function geocode(lat, lng) {
    const urls = [
      `https://data.geopf.fr/geocodage/reverse?lon=${lng}&lat=${lat}&limit=1`,
      `https://api-adresse.data.gouv.fr/reverse/?lon=${lng}&lat=${lat}&limit=1`
    ];
    let answered = false;
    for (const u of urls) {
      try {
        const r = await fetch(u); answered = true; if (!r.ok) continue;
        const j = await r.json(); const f = j.features && j.features[0];
        if (f && f.properties && f.properties.label) return f.properties.label;
      } catch (e) {}
    }
    try { // repli hors France : OpenStreetMap Nominatim
      const r = await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=18&lat=${lat}&lon=${lng}`, {headers: {'Accept-Language': 'fr'}});
      answered = true;
      if (r.ok) { const j = await r.json(); if (j.display_name) return j.display_name; }
    } catch (e) {}
    return answered ? null : undefined;   // undefined = aucun service joignable (hors ligne)
  }

  // ---------- Points ----------
  const markers = {};
  const icon = (moving, etat) => L.divIcon({className: 'pin' + (etat === 'prevu' ? ' todo' : '') + (moving ? ' moving' : ''), html: '<span></span>', iconSize: [28, 36], iconAnchor: [14, 34], popupAnchor: [0, -30]});
  const addrText = pt => pt.adresse || (pt.attente ? 'Adresse à retrouver quand le réseau reviendra' : 'Recherche de l’adresse…');

  function refreshAddr(pt) {
    document.querySelectorAll('.addr').forEach(el => { if (el.dataset.id === pt.id) el.textContent = addrText(pt); });
  }

  function popup(pt) {
    const d = document.createElement('div'); d.className = 'pop';
    d.innerHTML = `
      <div class="addr" data-id="${esc(pt.id)}">${esc(addrText(pt))}</div>
      <div class="meta">${pt.etat === 'prevu' ? 'À visiter' : `Sonné le ${esc(fmt(pt.date))}`}${pt.acc ? ` · GPS ±${esc(pt.acc)} m` : ''}</div>
      <label for="n-${esc(pt.id)}">Note</label>
      <textarea id="n-${esc(pt.id)}" rows="3" placeholder="Ce que tu veux retenir…">${esc(pt.note)}</textarea>
      <div class="acts">
        ${pt.etat === 'prevu' ? '<button type="button" data-a="ring" class="primary">J’ai sonné ici</button>' : ''}
        <button type="button" data-a="move">Déplacer</button>
        <button type="button" data-a="geo">Revoir l’adresse</button>
        <button type="button" data-a="del" class="danger">Supprimer</button>
      </div>`;
    const ta = d.querySelector('textarea');
    ta.addEventListener('input', () => { pt.note = ta.value; touch(pt); save(); });
    ta.addEventListener('change', renderList);
    d.addEventListener('click', e => {
      const a = e.target.dataset && e.target.dataset.a; if (!a) return;
      const m = markers[pt.id];
      if (a === 'ring') {
        pt.etat = 'sonne'; pt.date = new Date().toISOString(); touch(pt); save();
        m.setIcon(icon(false, pt.etat)); m.closePopup(); m.openPopup(); renderList();
      }
      if (a === 'move') { m.closePopup(); m.setIcon(icon(true, pt.etat)); m.dragging.enable(); toast('Fais glisser le point à sa bonne place'); }
      if (a === 'geo') locate(pt);
      if (a === 'del' && confirm('Supprimer ce point ?')) {
        map.removeLayer(m); delete markers[pt.id];
        points = points.filter(p => p.id !== pt.id); save(); renderList();
      }
    });
    L.DomEvent.disableClickPropagation(d);
    return d;
  }

  function draw(pt) {
    const m = L.marker([pt.lat, pt.lng], {icon: icon(false, pt.etat), draggable: true, autoPan: true}).addTo(map);
    m.dragging.disable();
    m.bindPopup(() => popup(pt), {minWidth: 240, maxWidth: 300});
    m.on('dragend', () => {
      const ll = m.getLatLng(); pt.lat = ll.lat; pt.lng = ll.lng; pt.acc = null; touch(pt);
      m.dragging.disable(); m.setIcon(icon(false, pt.etat)); save(); m.openPopup();
      if (pt.etat !== 'prevu') locate(pt);   // une adresse de la BAN garde son libellé officiel
    });
    markers[pt.id] = m;
    return m;
  }

  async function locate(pt) {
    pt.adresse = ''; pt.attente = false; refreshAddr(pt);
    const a = await geocode(pt.lat, pt.lng);
    if (a === undefined) pt.attente = true;   // hors ligne : on réessaiera au retour du réseau
    else pt.adresse = a || `${pt.lat.toFixed(5)}, ${pt.lng.toFixed(5)} (adresse non trouvée)`;
    touch(pt); save(); refreshAddr(pt); renderList();
  }

  function addPoint(lat, lng, acc) {
    const pt = {id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), lat, lng,
      acc: acc ? Math.round(acc) : null, adresse: '', date: new Date().toISOString(), note: '', etat: 'sonne'};
    touch(pt);
    points.push(pt); save(); renderList();
    const m = draw(pt);
    map.setView([lat, lng], Math.max(map.getZoom(), 18));
    m.openPopup();
    locate(pt);
  }

  // ---------- Bouton « Je sonne ici » ----------
  const ring = $('ring'), ringLabel = ring.querySelector('span');
  ring.addEventListener('click', () => {
    const use = p => addPoint(p.coords.latitude, p.coords.longitude, p.coords.accuracy);
    if (lastPos && Date.now() - lastPos.timestamp < 10000) return use(lastPos);
    if (!('geolocation' in navigator)) return toast('Ce navigateur ne donne pas la position');
    ring.disabled = true; ringLabel.textContent = 'Localisation…';
    const done = () => { ring.disabled = false; ringLabel.textContent = 'Je sonne ici'; };
    navigator.geolocation.getCurrentPosition(p => { done(); use(p); }, e => { done(); toast(geoError(e), 4500); },
      {enableHighAccuracy: true, timeout: 15000, maximumAge: 0});
  });

  // Appui long (ou clic droit) sur la carte : placer un point à la main
  map.on('contextmenu', e => addPoint(e.latlng.lat, e.latlng.lng, null));

  // ---------- Liste ----------
  function openSheet(id) {
    document.querySelectorAll('.sheet').forEach(s => s.classList.toggle('open', s.id === id));
    $('backdrop').classList.toggle('open', !!id);
  }
  $('listBtn').addEventListener('click', () => openSheet('sheet'));
  $('streetBtn').addEventListener('click', () => openSheet('streetSheet'));
  document.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', () => openSheet(null)));
  $('backdrop').addEventListener('click', () => openSheet(null));

  function renderList() {
    const done = points.filter(p => p.etat !== 'prevu').length, todo = points.length - done;
    $('listBtn').textContent = todo ? `Liste (${done}/${points.length})` : `Liste (${points.length})`;
    $('sheetTitle').textContent = (done > 1 ? `${done} portes visitées` : `${done} porte visitée`) + (todo ? ` · ${todo} à visiter` : '');
    const sorted = [...points].sort((a, b) =>
      (a.etat === 'prevu') - (b.etat === 'prevu') ||
      (a.etat === 'prevu' ? (a.num || 0) - (b.num || 0) || addrText(a).localeCompare(addrText(b), 'fr', {numeric: true})
                          : String(b.date).localeCompare(String(a.date))));
    $('list').innerHTML = sorted.length ? sorted.map(p => `
      <li><button type="button" data-id="${esc(p.id)}">
        <b>${esc(addrText(p))}</b><small>${p.etat === 'prevu' ? 'À visiter' : esc(fmt(p.date))}</small>${p.note ? `<em>${esc(p.note)}</em>` : ''}
      </button></li>`).join('')
      : '<li class="empty">Aucune porte pour l’instant. Appuie sur « Je sonne ici » devant une porte.</li>';
  }
  $('list').addEventListener('click', e => {
    const b = e.target.closest('button[data-id]'); if (!b) return;
    const m = markers[b.dataset.id]; if (!m) return;
    openSheet(null); map.setView(m.getLatLng(), 18); m.openPopup();
  });

  // ---------- Export / import ----------
  function download(name, text, type) {
    const url = URL.createObjectURL(new Blob([text], {type}));
    const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1000);
  }
  const stamp = () => new Date().toISOString().slice(0, 10);
  $('expJson').addEventListener('click', () => download(`porte-a-porte-${stamp()}.json`, JSON.stringify(points, null, 2), 'application/json'));
  $('expCsv').addEventListener('click', () => {
    const q = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
    const rows = [['id', 'etat', 'date', 'adresse', 'latitude', 'longitude', 'precision_m', 'note'].join(';')]
      .concat(points.map(p => [p.id, p.etat === 'prevu' ? 'à visiter' : 'sonné', p.date ? fmt(p.date) : '', p.adresse, p.lat, p.lng, p.acc ?? '', p.note].map(q).join(';')));
    download(`porte-a-porte-${stamp()}.csv`, '﻿' + rows.join('\r\n'), 'text/csv;charset=utf-8');
  });
  $('impJson').addEventListener('click', () => $('impFile').click());
  $('impFile').addEventListener('change', async e => {
    const f = e.target.files[0]; if (!f) return;
    try {
      const data = JSON.parse(await f.text());
      if (!Array.isArray(data)) throw 0;
      let n = 0;
      for (const p of data) {
        if (!p || !p.id || typeof p.lat !== 'number' || typeof p.lng !== 'number' || points.some(x => x.id === p.id)) continue;
        const etat = p.etat === 'prevu' ? 'prevu' : 'sonne';
        const pt = {id: String(p.id), lat: p.lat, lng: p.lng, acc: p.acc ?? null, adresse: String(p.adresse ?? ''),
          date: p.date || (etat === 'prevu' ? null : new Date().toISOString()), note: String(p.note ?? ''), etat, num: p.num ?? null, maj: p.maj || new Date().toISOString(), attente: !!p.attente};
        points.push(pt); draw(pt); n++;
      }
      save(); renderList(); toast(`${n} point(s) importé(s)`);
    } catch (err) { toast('Fichier non reconnu'); }
    e.target.value = '';
  });
  $('clearAll').addEventListener('click', () => {
    if (!points.length || !confirm('Effacer toutes les portes ? Pense à exporter avant.')) return;
    Object.values(markers).forEach(m => map.removeLayer(m));
    for (const k in markers) delete markers[k];
    points = []; save(); renderList();
  });
  $('clearTodo').addEventListener('click', () => {
    const todo = points.filter(p => p.etat === 'prevu');
    if (!todo.length || !confirm(`Retirer les ${todo.length} adresse(s) pas encore visitée(s) ?`)) return;
    todo.forEach(p => { map.removeLayer(markers[p.id]); delete markers[p.id]; });
    points = points.filter(p => p.etat !== 'prevu'); save(); renderList();
  });

  // ---------- Ajouter toutes les adresses d'une rue ----------
  const GEO = 'https://data.geopf.fr/geocodage/search';
  async function geoSearch(params) {
    const r = await fetch(GEO + '?' + new URLSearchParams({index: 'address', ...params}));
    if (!r.ok) {
      if (params.limit > 20) return geoSearch({...params, limit: 20});
      throw new Error('HTTP ' + r.status);
    }
    return (await r.json()).features || [];
  }
  const streetMsg = t => { $('streetMsg').textContent = t; };
  let streetResults = [];

  $('streetForm').addEventListener('submit', async e => {
    e.preventDefault();
    const q = $('streetQ').value.trim(); if (q.length < 3) return;
    streetMsg('Recherche de la rue…'); $('streetList').innerHTML = '';
    try {
      streetResults = (await geoSearch({q, type: 'street', limit: 5})).filter(f => f.properties);
      if (!streetResults.length) return streetMsg('Aucune rue trouvée. Vérifie l’orthographe ou ajoute la ville.');
      streetMsg('Choisis la rue :');
      $('streetList').innerHTML = streetResults.map((f, i) => `
        <li><button type="button" data-i="${i}"><b>${esc(f.properties.name)}</b><small>${esc(f.properties.postcode)} ${esc(f.properties.city)}</small></button></li>`).join('');
    } catch (err) { streetMsg(navigator.onLine ? 'Le service d’adresses ne répond pas. Réessaie dans un instant.' : 'Pas de réseau : la recherche de rue a besoin d’internet. Les épingles déjà posées restent utilisables.'); }
  });

  $('streetList').addEventListener('click', e => {
    const b = e.target.closest('button[data-i]'); if (b) loadStreet(streetResults[+b.dataset.i].properties);
  });

  async function loadStreet(s) {
    $('streetList').innerHTML = '';
    streetMsg(`Récupération des numéros de ${s.name}…`);
    const found = new Map();
    const add = (num, lat, lng, label) => {
      const k = norm(num).replace(/ /g, '');
      if (k && !found.has(k) && isFinite(lat) && isFinite(lng)) found.set(k, {num: String(num), lat, lng, label});
    };
    const addBan = (features, k) => {   // vrai seulement si le numéro demandé (k, k bis…) existe
      let hit = false;
      for (const f of features) {
        const p = f.properties || {};
        if (norm(p.street) !== norm(s.name) || !p.housenumber) continue;
        add(p.housenumber, f.geometry.coordinates[1], f.geometry.coordinates[0], p.label);
        if (parseInt(p.housenumber, 10) === k) hit = true;
      }
      return hit;
    };
    // 1) OpenStreetMap en premier : une seule requête, et donne une idée du plus grand numéro
    let maxOsm = 0; const osm = [];
    try {
      const re = s.name.replace(/[.*+?^${}()|[\]\\]/g, '\\$&').replace(/"/g, '\\"');
      const ql = `[out:json][timeout:25];area["ref:INSEE"="${s.citycode}"]["boundary"="administrative"]->.a;nwr(area.a)["addr:housenumber"]["addr:street"~"^${re}$",i];out center;`;
      const r = await fetch('https://overpass-api.de/api/interpreter', {method: 'POST', body: new URLSearchParams({data: ql})});
      if (r.ok) for (const el of (await r.json()).elements || []) {
        const lat = el.lat ?? el.center?.lat, lng = el.lon ?? el.center?.lon, num = el.tags['addr:housenumber'];
        String(num).split(/[;,]/).forEach(n => {
          maxOsm = Math.max(maxOsm, parseInt(n, 10) || 0);
          osm.push([n.trim(), lat, lng]);
        });
      }
    } catch (err) {}

    // 2) Base Adresse Nationale : elle ne renvoie que le numéro exact demandé,
    //    donc on interroge 1, 2, 3… par paquets de 10, jusqu'à 30 numéros de suite sans résultat
    let n = 1, lastHit = 0, failures = 0;
    while (n <= Math.max(lastHit, maxOsm) + 30 && n <= 2000) {
      const batch = Array.from({length: 10}, (_, i) => n + i);
      streetMsg(`Récupération des numéros de ${s.name}… (n° ${n}) — ${found.size} trouvé(s)`);
      const res = await Promise.allSettled(batch.map(k => geoSearch({q: `${k} ${s.name}`, type: 'housenumber', citycode: s.citycode, limit: 5})));
      res.forEach((r, i) => {
        if (r.status === 'fulfilled') { if (addBan(r.value, batch[i])) lastHit = batch[i]; }
        else failures++;
      });
      if (failures > 20) break;   // service indisponible : on garde ce qu'on a
      n += 10;
    }
    // les numéros OSM complètent ceux que la BAN n'a pas (bis, ter…)
    osm.forEach(([num, lat, lng]) => add(num, lat, lng, `${num} ${s.name} ${s.postcode} ${s.city}`));

    if (!found.size) return streetMsg('Aucun numéro trouvé pour cette rue.');
    const existing = new Set(points.map(p => norm(p.adresse)));
    const added = [];
    for (const a of found.values()) {
      if (existing.has(norm(a.label))) continue;
      const pt = {id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), lat: a.lat, lng: a.lng, acc: null,
        adresse: a.label, date: null, note: '', etat: 'prevu', num: parseInt(a.num, 10) || null};
      touch(pt);
      points.push(pt); draw(pt); added.push(pt);
    }
    save(); renderList();
    const skipped = found.size - added.length;
    streetMsg(`${added.length} adresse(s) ajoutée(s)` + (skipped ? `, ${skipped} déjà présente(s).` : '.'));
    toast(`${added.length} adresse(s) ajoutée(s) — en gris, à visiter`);
    const all = [...found.values()];
    openSheet(null);
    const zone = L.latLngBounds(all.map(a => [a.lat, a.lng])).pad(.15);
    map.fitBounds(zone, {maxZoom: 18});
    centered = true;
    cacheArea(zone, 15, 19).then(r => { if (r.ok) toast(`Carte de la rue gardée pour le hors ligne (${r.ok} morceaux)`); });
  }

  // ---------- Hors ligne ----------
  // Télécharge les tuiles d'une zone : le service worker (sw.js) les garde en cache.
  // Limité à quelques centaines de tuiles pour respecter les règles d'usage d'OpenStreetMap.
  const lon2x = (lng, z) => Math.floor((lng + 180) / 360 * 2 ** z);
  const lat2y = (lat, z) => { const r = lat * Math.PI / 180; return Math.floor((1 - Math.log(Math.tan(r) + 1 / Math.cos(r)) / Math.PI) / 2 * 2 ** z); };
  async function cacheArea(b, zMin, zMax, max = 400) {
    if (!navigator.serviceWorker || !navigator.serviceWorker.controller) return {ok: 0, total: 0, noSw: true};
    const urls = [];
    for (let z = zMin; z <= zMax; z++) {
      for (let x = lon2x(b.getWest(), z); x <= lon2x(b.getEast(), z); x++)
        for (let y = lat2y(b.getNorth(), z); y <= lat2y(b.getSouth(), z); y++) urls.push(`https://tile.openstreetmap.org/${z}/${x}/${y}.png`);
    }
    if (urls.length > max) return {ok: 0, total: urls.length, tooBig: true};
    let ok = 0;
    for (let i = 0; i < urls.length; i += 4) {
      const res = await Promise.allSettled(urls.slice(i, i + 4).map(u => fetch(u, {mode: 'cors'})));
      ok += res.filter(r => r.status === 'fulfilled' && r.value.ok).length;
    }
    return {ok, total: urls.length};
  }
  $('cacheZone').addEventListener('click', async () => {
    if (!navigator.onLine) return toast('Il faut du réseau pour télécharger la carte');
    const zMin = Math.max(14, map.getZoom() - 1);
    toast('Téléchargement de la carte de cette zone…', 10000);
    const r = await cacheArea(map.getBounds(), zMin, 19);
    if (r.noSw) toast('Recharge la page une fois, puis réessaie');
    else if (r.tooBig) toast('Zone trop grande : zoome davantage sur le quartier, puis réessaie', 4500);
    else toast(`Zone gardée hors ligne (${r.ok}/${r.total} morceaux de carte)`);
  });

  function retryPending() {
    if (!navigator.onLine) return;
    points.filter(p => p.attente && p.etat !== 'prevu').reduce((chain, p) => chain.then(() => locate(p)), Promise.resolve());
  }
  function setNet() { $('net').hidden = navigator.onLine; }
  window.addEventListener('online', () => {
    setNet();
    const n = points.filter(p => p.attente).length;
    if (n) toast(`Réseau revenu : recherche de ${n} adresse(s) en attente`);
    retryPending();
  });
  window.addEventListener('offline', () => { setNet(); toast('Hors ligne : tu peux continuer, tout est gardé sur le téléphone'); });
  setNet();
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});

  // ---------- Démarrage ----------
  points.forEach(draw);
  renderList();
  retryPending();
  if (points.length && !centered) map.fitBounds(L.latLngBounds(points.map(p => [p.lat, p.lng])).pad(.2), {maxZoom: 18});
  setTimeout(() => toast('Astuce : appui long sur la carte pour placer un point à la main', 4000), 1500);
}
</script>
</body>
</html>
